name: Android APK (no-EAS lane)

# Standalone installable APK built on GitHub runners — bypasses the EAS
# queue/upload entirely and prints full gradle logs on failure.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install JS deps (legacy peer deps per Frontend/.npmrc)
        run: npm ci --no-audit --no-fund

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK (uses committed android/ from expo prebuild)
        run: ./android/gradlew -p android assembleRelease --stacktrace --warning-mode all -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
        env:
          EXPO_PUBLIC_API_BASE_URL: https://susej-backend-production.up.railway.app
          EXPO_PUBLIC_ADMIN_URL: https://susej-admin-panel-theta.vercel.app
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: susej-release-apk
          path: Frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
